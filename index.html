<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rabbit Dosages</title>
  </head>
  <body>
    <div>
      <div id="info">
        <label for="weightInput">How much does your bunny weigh?</label>
        <input type="number" id="weightInput" name="weight" autofocus />

        <div id="unitButtons">
          <button id="poundsBtn">Use Pounds</button>
          <button id="kgBtn">Use Kilograms</button>
        </div>
      </div>

      <hr />

      <div id="drug">
        <button id="meloxicam" onclick="calcMeloxicam()" disabled>Meloxicam</button>
        <button id="metoclopramide" onclick="calcMetoclopramide()" disabled>Metoclopramide</button>
        <button id="cisapride" onclick="calcCisapride()" disabled>Cisapride</button>
        <button id="gabapentin" onclick="calcGabapentin()" disabled>Gabapentin</button>
        <button id="fluids" onclick="calcFluids()" disabled>Fluids</button>
      </div>

      <hr />

      <div id="result">
        <div id="weight"></div>
        <hr />
        <div id="drugConcentration"></div>
        <hr />
        <div id="dosage"></div>
      </div>
    </div>
    <div id="resetSection">
      <button id="resetBtn" onclick="resetForm()" style="display: none;">Reset</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
